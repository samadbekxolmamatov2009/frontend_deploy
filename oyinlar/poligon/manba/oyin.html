<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #fff; touch-action: none;

  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .panel { position: absolute; background: rgba(8, 12, 18, .62); border-radius: 8px; padding: 8px 14px; }
  #vitals { left: 18px; bottom: 18px; display: flex; gap: 18px; font-size: 30px; font-weight: 700; }

  #feed { position: absolute; right: 18px; top: 18px; text-align: right; font-size: 14px; font-weight: 600; }
  #feed div { background: rgba(8, 12, 18, .62); border-radius: 6px; padding: 4px 10px; margin-bottom: 4px; clear: both; float: right; }
  #toasts { position: absolute; left: 50%; top: 74px; transform: translateX(-50%); text-align: center; }
  #toasts div { background: rgba(255, 200, 60, .92); color: #1a1300; border-radius: 8px; padding: 6px 16px; margin-bottom: 6px;
    font-size: 15px; font-weight: 800; animation: toast 3.6s forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  #cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #cross i { position: absolute; background: #7CFF6B; box-shadow: 0 0 2px #000; }
  #cross .l, #cross .r { width: 9px; height: 2px; top: -1px; }
  #cross .u, #cross .d { width: 2px; height: 9px; left: -1px; }
  #cross .dot { width: 3px; height: 3px; left: -1.5px; top: -1.5px; border-radius: 50%; }
  #hit { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; opacity: 0;
    background: linear-gradient(45deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%), linear-gradient(-45deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%);
    -webkit-mask: radial-gradient(circle, transparent 5px, #000 6px); mask: radial-gradient(circle, transparent 5px, #000 6px); }
  #dmg { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-size: 18px; font-weight: 800; text-shadow: 0 1px 4px #000; opacity: 0; white-space: nowrap; }
  #hurt { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 0, 0, .55)); }
  #blind { position: absolute; inset: 0; opacity: 0; background: #fff; }
  #dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  #dmgdir::after { content: ""; position: absolute; left: -40px; top: -150px; width: 80px; height: 14px; border-radius: 50%; border-top: 5px solid #ff3b2f; }
  #scope { position: absolute; inset: 0; display: none; background: radial-gradient(circle at center, transparent 0, transparent 34vh, #000 34.4vh); }
  #scope::before, #scope::after { content: ""; position: absolute; background: #000; }
  #scope::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  #scope::after { top: 50%; left: 0; right: 0; height: 1px; }
  #msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; font-size: 32px; font-weight: 800; text-shadow: 0 2px 8px #000; white-space: nowrap; }

  #buy .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 0 26px; }
  #buy .row { display: flex; justify-content: space-between; gap: 20px; padding: 3px 0; }
  #buy .row.off { opacity: .4; }
  kbd { background: #fff; color: #000; border-radius: 4px; padding: 0 6px; font: 700 13px system-ui; }
  #overlay { position: fixed; inset: 0; display: flex; z-index: 20; background: rgba(5, 8, 12, .8); text-align: center; padding: 14px; overflow: auto; touch-action: pan-y; }
  #overlay .box { max-width: 680px; width: 100%; margin: auto; }
  #overlay h1 { font-size: 46px; margin: 0 0 4px; letter-spacing: .04em; }
  #overlay h2 { font-size: 26px; margin: 0 0 10px; }

  body.touch #ammo { left: 50%; right: auto; bottom: 8px; transform: translateX(4%); font-size: 20px; padding: 4px 10px; }
  body.touch #money { left: 12px; top: 124px; bottom: auto; font-size: 15px; padding: 4px 10px; }
  body.touch #nade { display: none; }
  body.touch #radar { left: 12px; top: 10px; width: 150px; height: 103px; }
  body.touch #fps { left: 12px; top: 160px; }
  body.touch #feed { right: 60px; top: 10px; font-size: 12px; }

</style>

<script>
window.addEventListener('error', e => {
  const b = document.getElementById('obox');
  if (b && !b.dataset.ok) { document.getElementById('overlay').style.display = 'flex';
    b.innerHTML = "<h1>Xatolik</h1><p>O'yin ishga tushmadi: " + (e.message || "noma'lum xato") + "</p><p class='note'>Qurilmangiz 3D grafikani (WebGL) qo'llashini tekshiring va qayta oching.</p>"; }
});
(() => {
'use strict';
const T = THREE, V3 = T.Vector3;
const $ = id => document.getElementById(id);
const DEBUG = /[?&]debug/.test(location.search);
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };
const COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
// Xaritalar har safar bir xil chiqishi uchun o'z tasodifiy sonlar generatori
let seed = 1;
const srand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

// ---------------------------------------------------------------- Sozlamalar va profil
const settings = {
  sens: 1, vol: .7, invert: false, quality: 'auto', showFps: false,
  keys: { fwd: 'KeyW', back: 'KeyS', left: 'KeyA', right: 'KeyD', jump: 'Space', crouch: 'KeyC', sprint: 'ShiftLeft', reload: 'KeyR',
    swap: 'KeyQ', nade: 'KeyG', nadeType: 'KeyX', buy: 'KeyB', full: 'KeyF' },
  touch: { scale: 1, autoFire: true, assist: true, pos: {} },
  match: { mode: 'rounds', map: 0, diff: 1, mates: 4, foes: 5, rounds: 6, kills: 30 },
};
const profile = { xp: 0, kills: 0, deaths: 0, heads: 0, matches: 0, wins: 0, best: 0, ach: {}, wskin: 'std', outfit: 'blue' };
function loadStore(key, into) {
  try {
    const d = JSON.parse(localStorage.getItem(key) || '{}');
    for (const k in d) { if (into[k] && typeof into[k] === 'object' && !Array.isArray(into[k])) Object.assign(into[k], d[k]); else into[k] = d[k]; }
  } catch (e) {}
}
loadStore('poligon-sozlamalar', settings); loadStore('poligon-profil', profile);
const saveSettings = () => { try { localStorage.setItem('poligon-sozlamalar', JSON.stringify(settings)); } catch (e) {} };
const saveProfile = () => { try { localStorage.setItem('poligon-profil', JSON.stringify(profile)); } catch (e) {} };
const levelOf = xp => Math.floor((Math.sqrt(1 + 8 * xp / 500) - 1) / 2) + 1;
const xpFor = lvl => 500 * lvl * (lvl - 1) / 2;
const WSKINS = [
  { id: 'std', name: 'Standart', lvl: 1, body: 0x24272c, acc: 0x80552f },
  { id: 'sand', name: 'Qum', lvl: 2, body: 0xb59a6a, acc: 0x5d4a2c },
  { id: 'forest', name: "O'rmon", lvl: 3, body: 0x3f5a3a, acc: 0x23281c },
  { id: 'ice', name: 'Muz', lvl: 5, body: 0x3a6ea8, acc: 0xd5e3f0 },
  { id: 'fire', name: 'Olov', lvl: 7, body: 0x9c2f24, acc: 0x1b1b1b },
  { id: 'gold', name: 'Oltin', lvl: 10, body: 0xc9a227, acc: 0x2a2110 },
];
const OUTFITS = [
  { id: 'blue', name: "Ko'k", lvl: 1, uni: 0x2f5fae, vest: 0x1b2f55, pants: 0x2b3038, helm: 0x1b2f55 },
  { id: 'green', name: 'Yashil', lvl: 3, uni: 0x3d6b3a, vest: 0x24361f, pants: 0x3a3a2c, helm: 0x24361f },
  { id: 'black', name: 'Qora', lvl: 5, uni: 0x2a2d33, vest: 0x15171a, pants: 0x1f2126, helm: 0x15171a },
  { id: 'violet', name: 'Binafsha', lvl: 8, uni: 0x6a3fa8, vest: 0x35205a, pants: 0x2b2a38, helm: 0x35205a },
];
const RED_OUTFIT = { uni: 0xa8862f, vest: 0x8a2a1f, pants: 0x4a3f2c, helm: 0x7a2319 };
const ACH = [
  { id: 'first', name: 'Birinchi qon', desc: "Birinchi raqibni yo'q qiling", ok: p => p.kills >= 1 },
  { id: 'k50', name: 'Jangchi', desc: '50 ta raqib', ok: p => p.kills >= 50 },
  { id: 'k250', name: 'Veteran', desc: '250 ta raqib', ok: p => p.kills >= 250 },
  { id: 'h25', name: 'Mergan', desc: '25 ta boshga otish', ok: p => p.heads >= 25 },
  { id: 's5', name: "To'xtovsiz", desc: "O'lmasdan 5 ta raqib", ok: p => p.best >= 5 },
  { id: 'w1', name: "G'olib", desc: "Birinchi g'alaba", ok: p => p.wins >= 1 },
  { id: 'hard', name: 'Temir iroda', desc: "Qiyin darajada g'alaba", ok: (p, c) => c && c.hardWin },
  { id: 'nade', name: 'Portlovchi', desc: "Granata bilan yo'q qiling", ok: (p, c) => c && c.nadeKill },
];
function toast(html) { const d = document.createElement('div'); d.innerHTML = html; $('toasts').appendChild(d); setTimeout(() => d.remove(), 3700); }
function addXp(n, ctx) {
  const before = levelOf(profile.xp); profile.xp += n;
  for (const a of ACH) if (!profile.ach[a.id] && a.ok(profile, ctx)) { profile.ach[a.id] = 1; profile.xp += 300; toast('Yutuq: ' + a.name + ' +300'); }
  const after = levelOf(profile.xp);
  if (after > before) {
    const un = [...WSKINS, ...OUTFITS].filter(s => s.lvl > before && s.lvl <= after).map(s => s.name);
    toast(after + '-daraja!' + (un.length ? ' Ochildi: ' + un.join(', ') : '')); beep(660, .12); setTimeout(() => beep(990, .2), 130);
  }
  saveProfile();
}

// ---------------------------------------------------------------- Dunyo to'ri
// Xarita 2 metrli kataklardan iborat. Har bir katakning balandligi bor: 0 = bo'sh joy.
const GW = 64, GH = 44, CS = 2, MW = GW * CS, MH = GH * CS, OOB = 99;
let hgt = new Float32Array(GW * GH), typ = new Uint8Array(GW * GH);
let freeCells = [], spawnCells = { blue: [], red: [] }, mapObjs = [];
const KIND = { wall: [1, 6], bld: [1, 7], crate: [2, 1.2], crate2: [2, 2.4], cont: [3, 2.6], sand: [4, 1.0], barrel: [5, 1.1], car: [6, 1.4], planter: [7, .9], pillar: [8, 3] };
const cellH = (c, r) => (r < 0 || c < 0 || r >= GH || c >= GW) ? OOB : hgt[r * GW + c];
const cellCenter = (c, r) => new V3((c + .5) * CS, 0, (r + .5) * CS);

function blocked(x, z, rad, feet) {
  const c0 = Math.floor((x - rad) / CS), c1 = Math.floor((x + rad) / CS), r0 = Math.floor((z - rad) / CS), r1 = Math.floor((z + rad) / CS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (cellH(c, r) > feet + .35) return true;
  return false;
}
function slide(pos, dx, dz, rad) {
  let hit = 0;
  if (!blocked(pos.x + dx, pos.z, rad, pos.y)) pos.x += dx; else hit |= 1;
  if (!blocked(pos.x, pos.z + dz, rad, pos.y)) pos.z += dz; else hit |= 2;
  return hit;
}
function groundAt(x, z, feet) { const h = cellH(Math.floor(x / CS), Math.floor(z / CS)); return h <= feet + .35 ? h : 0; }

// Nurni to'r bo'ylab yuritish: devorga, to'siq ustiga yoki yerga tegish nuqtasini topadi
const RH = { t: 0, nx: 0, ny: 0, nz: 0, type: 0 };
function rayGrid(ox, oy, oz, dx, dy, dz, maxT) {
  let cx = Math.floor(ox / CS), cz = Math.floor(oz / CS);
  const sx = dx > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
  const tdx = dx !== 0 ? Math.abs(CS / dx) : 1e9, tdz = dz !== 0 ? Math.abs(CS / dz) : 1e9;
  let tmx = dx !== 0 ? (dx > 0 ? (cx + 1) * CS - ox : ox - cx * CS) / Math.abs(dx) : 1e9;
  let tmz = dz !== 0 ? (dz > 0 ? (cz + 1) * CS - oz : oz - cz * CS) / Math.abs(dz) : 1e9;

function updateCamera(dt) {
  const w = curW();

    const bob = player.onGround ? Math.sin(player.bobT) * .018 * Math.min(1, Math.hypot(player.vx, player.vz) / 6) * (1 - player.adsT) : 0;
    camera.position.set(player.pos.x, player.pos.y + player.eyeH + bob, player.pos.z);
    camera.rotation.set(clamp(player.pitch + player.recoil, -1.55, 1.55), player.yaw, 0);
  } else {
    const mate = bots.find(b => b.team === 'blue' && b.alive) || bots.find(b => b.alive);
    if (mate) {
      const want = tmpB.set(mate.pos.x - Math.sin(mate.yaw) * 3.4, 2.7, mate.pos.z - Math.cos(mate.yaw) * 3.4);
      camera.position.lerp(want, Math.min(1, dt * 5)); camera.lookAt(mate.pos.x, 1.5, mate.pos.z);

  if (Math.abs(camera.fov - fov) > .05) { camera.fov = fov; camera.updateProjectionMatrix(); }
  for (const id in viewmodels) viewmodels[id].visible = false;
  player.swayX += (clamp(-player.lookDX * .0012, -.03, .03) - player.swayX) * Math.min(1, dt * 10);
  player.swayY += (clamp(player.lookDY * .0012, -.03, .03) - player.swayY) * Math.min(1, dt * 10);
  player.lookDX = player.lookDY = 0;
  if (player.alive && !scoped) {
    const vm = viewmodels[curSlot().id], k = player.kickAnim, ads = player.adsT, hip = 1 - ads;
    const mv = Math.min(1, Math.hypot(player.vx, player.vz) / 6) * (player.onGround ? 1 : 0);
    const bx = Math.sin(player.bobT * .5) * .012 * mv * (hip * .9 + .1), by = Math.abs(Math.cos(player.bobT * .5)) * .01 * mv * (hip * .9 + .1);

    if (k < .55) vm.userData.flash.visible = false;
  }
}

  else if (state === 'live') { phaseT -= dt; if (phaseT <= 0) { if (cfg.mode === 'tdm') endMatch(); else endRound('red', 'Vaqt tugadi'); } }
  else if (state === 'end') { phaseT -= dt; if (phaseT <= 0) { if (stats.blue >= cfg.rounds || stats.red >= cfg.rounds) endMatch(); else startRound(); } }

}
let last = performance.now(), menuAng = 0;
function frame(t) {

$('obox').dataset.ok = '1';
