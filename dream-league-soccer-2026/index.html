<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dream League Soccer 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="gameRoot">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div id="scoreboard">
        <span class="team-name you">SIZ</span>
        <span id="score">0 : 0</span>
        <span class="team-name rival">RAQIB</span>
      </div>
      <div id="timer">03:00</div>
    </div>

    <div id="goalFlash">GOL!!!</div>

    <!-- Start screen -->
    <div id="startScreen" class="overlay">
      <h1>DREAM LEAGUE<br><span>SOCCER 2026</span></h1>
      <p class="hint">Chapdagi joystik bilan yuring. O'ng tomondagi A / B / C tugmalari bilan o'ynang.</p>
      <ul class="legend">
        <li><b class="btn-a">A</b> Pas berish</li>
        <li><b class="btn-b">B</b> Zarba (shoot)</li>
        <li><b class="btn-c">C</b> Sprint (tezlashish)</li>
      </ul>
      <button id="startBtn">O'YINNI BOSHLASH</button>
    </div>

    <!-- Full time screen -->
    <div id="endScreen" class="overlay hidden">
      <h2>O'YIN TUGADI</h2>
      <p id="finalScore"></p>
      <button id="restartBtn">QAYTA O'YNASH</button>
    </div>

    <!-- Controls -->
    <div id="controls">
      <div id="joystickZone">
        <div id="joystickBase">
          <div id="joystickStick"></div>
        </div>
      </div>

      <div id="actionZone">
        <div id="staminaWrap"><div id="staminaBar"></div></div>
        <div class="buttonsRow">
          <button id="btnA" class="actionBtn btn-a">A</button>
          <button id="btnB" class="actionBtn btn-b">B</button>
          <button id="btnC" class="actionBtn btn-c">C</button>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
